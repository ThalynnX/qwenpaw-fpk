name: Build QwenPaw FPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'manifest'
      - 'cmd/**'
      - 'wizard/**'
      - 'config/**'
      - 'app/**'
      - 'ICON.PNG'
      - 'ICON_256.PNG'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          curl -sL https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack
          fnpack --help

      - name: Validate shell scripts
        run: |
          for f in cmd/* app/*.sh; do
            bash -n "$f" || { echo "Syntax error: $f"; exit 1; }
          done

      - name: Validate JSON
        run: |
          for j in config/privilege config/resource app/ui/config wizard/install; do
            python3 -c "import json,sys; json.load(open('$j'))" || { echo "Invalid JSON: $j"; exit 1; }
          done

      - name: Build FPK
        run: fnpack build

      - name: Verify artifact
        run: |
          test -f qwenpaw.fpk
          echo "fpk OK, size:"
          ls -la qwenpaw.fpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-fpk
          path: qwenpaw.fpk

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qwenpaw.fpk
          generate_release_notes: true
