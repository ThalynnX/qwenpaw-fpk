name: Build QwenPaw (all platforms)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-synced]
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main, stable ]
    paths:
      - 'manifest'
      - 'cmd/**'
      - 'wizard/**'
      - 'config/**'
      - 'app/**'
      - 'Dockerfile'
      - 'docker/**'
      - 'packaging/**'
      - 'ICON.PNG'
      - 'ICON_256.PNG'
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  APP_ID: com.thalynnx.qwenpaw
  IMAGE: ghcr.io/thalynnx/qwenpaw

jobs:
  prepare:
    name: 准备源码与控制台
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      date: ${{ steps.ver.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: 拉取上游 stable 源码
        run: |
          git clone --depth 1 --branch stable https://github.com/ThalynnX/qwenpaw.git src
          rm -rf src/.git src/e2e src/.github
      - id: ver
        run: |
          V=$(grep '__version__' src/src/qwenpaw/__version__.py | sed -E 's/.*"([^"]+)".*/\1/')
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "源码版本: $V / $D"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "date=$D" >> $GITHUB_OUTPUT
      - name: 构建 Web 控制台前端
        run: |
          cd src/console
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
          rm -rf node_modules
      - name: 整理产物目录
        run: |
          mkdir -p out
          tar -czf out/source.tar.gz -C src .
          tar -czf out/console-dist.tar.gz -C src/console dist
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: out/*
          retention-days: 3
          compression-level: 0

  fnos:
    name: 飞牛 fnOS FPK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载 fnpack
        run: |
          for i in 1 2 3 4 5; do
            curl -sfL --connect-timeout 20 --max-time 300 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /usr/local/bin/fnpack && break
            echo "第 ${i} 次失败，重试"; sleep 5
          done
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -5
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out
      - name: 组装应用目录
        run: |
          mkdir -p app/qwenpaw/code
          tar -xzf out/source.tar.gz -C app/qwenpaw/code
          mkdir -p app/qwenpaw/code/console
          tar -xzf out/console-dist.tar.gz -C app/qwenpaw/code/console
          sed -i "s/^version[[:space:]]*=.*/version                    = ${{ needs.prepare.outputs.version }}/" manifest
          grep '^version' manifest
      - name: 校验脚本与 JSON
        run: |
          for f in cmd/* app/ui/index.cgi packaging/*.sh; do bash -n "$f" || { echo "语法错误: $f"; exit 1; }; done
          for j in config/privilege config/resource app/ui/config; do python3 -c "import json;json.load(open('$j'))" || exit 1; done
      - name: 打包 FPK（双架构命名）
        run: |
          tar -czf app.tgz -C app .
          fnpack build
          D=${{ needs.prepare.outputs.date }}
          for A in x86_64 arm64; do cp com.thalynnx.qwenpaw.fpk "${APP_ID}-${D}-${A}.fpk"; done
          cp com.thalynnx.qwenpaw.fpk "${APP_ID}-${D}.fpk"
          ls -la *.fpk
          for f in *.fpk; do tar -tzf "$f" >/dev/null || { echo "包损坏: $f"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: fpk
          path: '*.fpk'
          retention-days: 3
          compression-level: 0

  docker:
    name: Docker 多架构镜像
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out
      - name: 组装构建上下文
        run: |
          mkdir -p ctx/code
          tar -xzf out/source.tar.gz -C ctx/code
          mkdir -p ctx/code/console
          tar -xzf out/console-dist.tar.gz -C ctx/code/console
          cp Dockerfile ctx/Dockerfile
          cp docker/docker-entrypoint.sh ctx/docker-entrypoint.sh
          ls ctx
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thalynnx/qwenpaw:${{ needs.prepare.outputs.version }}
            ghcr.io/thalynnx/qwenpaw:latest

  linux-tar:
    name: 通用 Linux 包
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out
      - name: 打包
        run: |
          ARCH=${{ matrix.arch }}
          mkdir -p pkg/qwenpaw-${ARCH}
          mkdir -p pkg/qwenpaw-${ARCH}/code
          tar -xzf out/source.tar.gz -C pkg/qwenpaw-${ARCH}/code
          mkdir -p pkg/qwenpaw-${ARCH}/console
          tar -xzf out/console-dist.tar.gz -C pkg/qwenpaw-${ARCH}/console
          cp packaging/install.sh packaging/uninstall.sh pkg/qwenpaw-${ARCH}/
          chmod +x pkg/qwenpaw-${ARCH}/*.sh
          mkdir -p dist
          tar -czf "dist/qwenpaw-${{ needs.prepare.outputs.version }}-linux-${ARCH}.tar.gz" -C pkg "qwenpaw-${ARCH}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: tar-${{ matrix.arch }}
          path: dist/*
          retention-days: 3
          compression-level: 0

  deb:
    name: Debian 包
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: out
      - name: 出 deb
        run: |
          ARCH=${{ matrix.arch }}
          mkdir -p stage/code
          tar -xzf out/source.tar.gz -C stage/code
          mkdir -p stage/console
          tar -xzf out/console-dist.tar.gz -C stage/console
          cp packaging/install.sh packaging/uninstall.sh stage/
          chmod +x packaging/build-deb.sh
          bash packaging/build-deb.sh "${{ needs.prepare.outputs.version }}" "${ARCH}" "$PWD/stage" "$PWD/dist"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*
          retention-days: 3
          compression-level: 0

  release:
    name: 发布全部产物
    needs: [prepare, fnos, docker, linux-tar, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.fpk' -o -name '*.deb' -o -name 'qwenpaw-*-linux-*.tar.gz' \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: QwenPaw v${{ needs.prepare.outputs.version }}（全平台）
          files: release/*
          fail_on_unmatched_files: false
          make_latest: true
          generate_release_notes: false
          body: |
            由 ThalynnX 自动编译发布，覆盖飞牛 fnOS、Docker、通用 Linux、Debian 四类平台。

            | 文件 | 用途 |
            | --- | --- |
            | `com.thalynnx.qwenpaw-*-x86_64.fpk` | 飞牛 fnOS（x86_64）原生应用 |
            | `com.thalynnx.qwenpaw-*-arm64.fpk` | 飞牛 fnOS（ARM64：RK3566 / N1 等） |
            | `ghcr.io/thalynnx/qwenpaw:<版本>` | Docker 多架构镜像（amd64/arm64），群晖、威联通、N1 通用 |
            | `qwenpaw-*-linux-amd64.tar.gz` / `-arm64.tar.gz` | 通用 Linux：解压后 `sudo bash install.sh` |
            | `qwenpaw_*_amd64.deb` / `_arm64.deb` | Debian/Ubuntu/Armbian：`sudo apt install ./*.deb` |

            ## 速查
            - 飞牛：应用中心 → 手动安装 → 选对应架构 fpk
            - Docker：`docker run -d -p 19091:19091 -v /vol1/qwenpaw:/data ghcr.io/thalynnx/qwenpaw:latest`
            - Debian：`sudo apt install ./qwenpaw_<版本>_<架构>.deb`
            - 通用：`tar -xzf qwenpaw-<版本>-linux-<架构>.tar.gz && cd qwenpaw-* && sudo bash install.sh`

            ## 说明
            - 数据目录：飞牛在 `@appshare/com.thalynnx.qwenpaw`，其它平台 `/var/lib/qwenpaw/.qwenpaw`，卸载保留。
            - 保留上游 Apache-2.0 许可与版权声明，未做删改。
