name: Build QwenPaw FPK (com.thalynnx.qwenpaw)

on:
  workflow_dispatch:
  schedule:
    # 每日 03:00(UTC) / 11:00(北京时间) 自动拉取最新源码编译
    - cron: '0 3 * * *'
  push:
    branches: [ main, stable ]
    paths:
      - 'manifest'
      - 'cmd/**'
      - 'wizard/**'
      - 'config/**'
      - 'app/**'
      - 'ICON.PNG'
      - 'ICON_256.PNG'
      - 'LICENSE'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          for i in 1 2 3 4 5; do
            curl -sL --connect-timeout 20 --max-time 300 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /usr/local/bin/fnpack && break
            echo "第 ${i} 次下载失败，5 秒后重试..."
            sleep 5
          done
          chmod +x /usr/local/bin/fnpack
          fnpack --help

      - name: Fetch stable qwenpaw source (v2.2.2.post1 稳定版分支)
        run: |
          git clone --depth 1 --branch stable https://github.com/ThalynnX/qwenpaw.git app/qwenpaw/code
          rm -rf app/qwenpaw/code/.git app/qwenpaw/code/e2e app/qwenpaw/code/.github
          VERSION=$(grep '__version__' app/qwenpaw/code/src/qwenpaw/__version__.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "源码版本: ${VERSION}"

      - name: Set build date (北京时间, 按日期隔开每天新包)
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "DATE=${DATE}" >> $GITHUB_ENV
          echo "构建日期: ${DATE}"

      - name: Update manifest version & info page
        run: |
          sed -i "s/^version[[:space:]]*=.*/version                    = ${VERSION}/" manifest
          sed -i "s/<span class=\"badge\">v[^<]*<\/span>/<span class=\"badge\">v${VERSION}<\/span>/" app/www/index.html
          grep '^version' manifest
          grep 'badge' app/www/index.html

      - name: Validate shell scripts
        run: |
          for f in cmd/* app/ui/index.cgi; do
            bash -n "$f" || { echo "Syntax error: $f"; exit 1; }
          done

      - name: Validate JSON
        run: |
          for j in config/privilege config/resource app/ui/config; do
            python3 -c "import json; json.load(open('$j'))" || { echo "Invalid JSON: $j"; exit 1; }
          done

      - name: Build web console (预构建 Web 控制台)
        run: |
          cd app/qwenpaw/code/console
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html && echo "console dist OK" || { echo "console build failed"; exit 1; }
          rm -rf node_modules
          echo "node_modules 已清理"

      - name: Package app.tgz (source + ui + www)
        run: |
          tar -czf app.tgz -C app .
          ls -la app.tgz

      - name: Build FPK
        run: fnpack build

      - name: Verify artifact
        run: |
          test -f com.thalynnx.qwenpaw.fpk
          cp com.thalynnx.qwenpaw.fpk com.thalynnx.qwenpaw-${DATE}.fpk
          echo "fpk OK (com.thalynnx.qwenpaw-${DATE}.fpk):"
          ls -la com.thalynnx.qwenpaw*.fpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.thalynnx.qwenpaw-fpk-${{ env.DATE }}
          path: com.thalynnx.qwenpaw-*.fpk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: com.thalynnx.qwenpaw-${{ env.DATE }}.fpk
          name: QwenPaw v${{ env.VERSION }} (fnOS fpk)
          body: |
            基于 ThalynnX/qwenpaw 源码自动编译的飞牛 fnOS 原生应用（非 Docker）。

            ## 安装
            - 下载本 Release 中**日期最新**的 com.thalynnx.qwenpaw-YYYYMMDD.fpk 安装。
            - 安装时自动创建 Python 虚拟环境并从本地源码安装依赖（无需联网拉源码）。
            - 依赖飞牛应用商店的 **Node.js v24** 与 **Python 3.12** 运行时（自动安装）。

            ## 说明
            - 应用标识：com.thalynnx.qwenpaw，独立应用，不影响社区包。
            - Web 控制台：安装后从应用中心「QwenPaw」入口打开（http://NAS:19091）。
            - 数据保存在授权目录 .qwenpaw，卸载保留。
            - 每个构建日期的包单独保留，按日期区分版本。
          generate_release_notes: false
          fail_on_unmatched_files: false
          make_latest: false
